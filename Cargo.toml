[package]
name = "projection-mapping"
version = "1.0.0"
edition = "2024"
description = "Native Projection-Mapping-App für macOS: Flächen, Masken, Effekte, Video, Kamera, Audio und Milkdrop"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "glsl", "naga-ir", "metal", "vulkan", "gles"] }
naga = { version = "30", features = ["glsl-in", "wgsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
tiny-skia = "0.11"
rustfft = "6"
cpal = "0.16"
rfd = "0.15"
libloading = "0.8"
glow = "0.16"
dirs = "6"
parking_lot = "0.12"

[dev-dependencies]
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
